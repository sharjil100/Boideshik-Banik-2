<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo credits — Boideshik Banik</title>
  <link rel="icon" href="assets/img/logo-source.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Jost', system-ui, sans-serif; color: #5f5a5a; background: #f8f8f4; }
    main { max-width: 860px; margin: 0 auto; padding: 64px 24px; }
    a { color: #6b4c4f; }
    h1 { font-weight: 400; font-size: 32px; text-transform: uppercase; color: #6b4c4f; margin: 0 0 8px; }
    p.lead { margin: 0 0 32px; font-size: 14px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
    li { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; padding: 14px; background: #fff; border-radius: 8px; font-size: 13px; line-height: 1.5; }
    li img { width: 96px; height: 64px; object-fit: cover; border-radius: 4px; }
    li b { font-weight: 500; color: #1f1d1d; }
  </style>
</head>
<body>
  <main>
    <a href="index.html">← Back to the site</a>
    <h1 style="margin-top:24px">Photo credits</h1>
    <p class="lead">Photographs on this site come from Wikimedia Commons and are used under the licences listed below. Product illustrations were drawn for this site.</p>
    <ul data-credits></ul>
  </main>
  <script>
    fetch('assets/img/photos/credits.json')
      .then(r => r.json())
      .then(list => {
        document.querySelector('[data-credits]').innerHTML = list.map(c => `
          <li>
            <img src="assets/img/photos/${c.file}" alt="">
            <div>
              <b>${c.title}</b><br>
              by ${c.author} ·
              ${c.licenseUrl ? `<a href="${c.licenseUrl}" target="_blank" rel="noopener">${c.license}</a>` : c.license} ·
              <a href="${c.sourcePage}" target="_blank" rel="noopener">Source</a>
            </div>
          </li>`).join('');
      });
  </script>
</body>
</html>
